<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/twofold-design-tokens-2755dc26-ae41-450e-96e7-92f167979f40/styles.css">
</helmet>
<div style="position:relative;width:390px;height:844px;border-radius:46px;overflow:hidden;background:var(--bg-base);border:1px solid var(--frame-line);font-family:var(--font-body);color:var(--text-1)">
  <dc-import name="StatusBar" hint-size="390px,54px"></dc-import>
  <div style="padding:4px 18px 0">
    <div style="display:flex;align-items:center;justify-content:space-between;height:44px">
      <div style="width:40px;height:40px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="var(--text-1)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5L8 12l6.5 7"></path></svg>
      </div>
      <div style="font-size:17px;font-weight:600">Would You Rather…?</div>
      <div style="width:40px"></div>
    </div>

    <div style="margin-top:10px;background:var(--hero-surface);border:1px solid var(--hero-line);border-radius:var(--radius-card);padding:18px;text-align:center;box-shadow:var(--shadow-card)">
      <div style="font-family:var(--title-font);font-size:52px;font-weight:600;line-height:1;letter-spacing:-.02em;color:var(--text-1)">50%</div>
      <div style="font-size:13px;font-weight:600;letter-spacing:.09em;color:var(--text-3);margin-top:8px">ANSWER SIMILARITY</div>
      <div style="margin-top:14px;height:8px;border-radius:999px;background:var(--track);overflow:hidden">
        <div style="width:50%;height:100%;border-radius:999px;background:var(--green-fill)"></div>
      </div>
      <div style="font-size:16px;font-weight:600;margin-top:12px;color:var(--text-1)">You matched 4 of 8 answers</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px;margin-top:14px">
      <sc-for list="{{items}}" as="q" hint-placeholder-count="4">
        <div style="background:var(--surface-1);border:1px solid {{q.line}};border-radius:16px;padding:14px 16px">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px">
            <div style="font-size:16px;font-weight:600;line-height:1.3">{{q.q}}</div>
            <div style="width:24px;height:24px;border-radius:999px;flex:none;background:{{q.badgeBg}};display:flex;align-items:center;justify-content:center">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="{{q.badgeFg}}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="{{q.badgeD}}"></path></svg>
            </div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px">
            <div>
              <div style="font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--text-3)">YOU</div>
              <div style="font-size:15px;font-weight:500;margin-top:4px;color:{{q.fg}}">{{q.you}}</div>
            </div>
            <div>
              <div style="font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--text-3)">EWIN</div>
              <div style="font-size:15px;font-weight:500;margin-top:4px;color:{{q.fg}}">{{q.them}}</div>
            </div>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
  <dc-import name="TabBar" active="Games" style="position:absolute;left:16px;right:16px;bottom:16px" hint-size="358px,70px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  renderVals() {
    const match = { line: "var(--green-chip-line)", badgeBg: "var(--green-chip)", badgeFg: "var(--green-text)", badgeD: "M6 12.5l4 4 8-8.5", fg: "var(--green-text)" };
    const miss = { line: "var(--line)", badgeBg: "var(--surface-3)", badgeFg: "var(--text-3)", badgeD: "M7 7l10 10M17 7L7 17", fg: "var(--text-2)" };
    return {
      items: [
        { ...miss, q: "Bail last minute or Always show up", you: "Bail last minute", them: "Always show up" },
        { ...match, q: "Skip the wedding or Skip the dream job", you: "Skip the wedding", them: "Skip the wedding" },
        { ...match, q: "Split 50/50 or Higher earner pays", you: "Higher earner pays", them: "Higher earner pays" },
        { ...match, q: "Keep us offline or Post everything", you: "Keep us offline", them: "Keep us offline" }
      ]
    };
  }
}
</script>
</body>
</html>
