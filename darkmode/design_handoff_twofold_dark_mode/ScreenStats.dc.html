<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/twofold-design-tokens-2755dc26-ae41-450e-96e7-92f167979f40/styles.css">
</helmet>
<div style="position:relative;width:390px;height:844px;border-radius:46px;overflow:hidden;background:var(--bg-base);border:1px solid var(--frame-line);font-family:var(--font-body);color:var(--text-1)">
  <dc-import name="StatusBar" hint-size="390px,54px"></dc-import>
  <div style="padding:4px 18px 0">
    <div style="font-family:var(--title-font);font-size:34px;font-weight:600;letter-spacing:-.02em;margin-top:18px">Stats</div>

    <div style="display:flex;padding:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;margin-top:16px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
        <div style="flex:1;text-align:center;padding:9px 0;border-radius:999px;font-size:15px;font-weight:{{t.weight}};color:{{t.fg}};background:{{t.bg}};box-shadow:{{t.shadow}}">{{t.label}}</div>
      </sc-for>
    </div>

    <div style="margin-top:16px;background:var(--hero-surface);border:1px solid var(--hero-line);border-radius:var(--radius-card);padding:18px;box-shadow:var(--shadow-card)">

      <sc-if value="{{isRelationship}}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;align-items:flex-start;justify-content:space-between">
          <div style="width:38px"></div>
          <div style="display:flex;align-items:center;gap:12px;padding-top:2px">
            <div style="width:54px;height:54px;border-radius:999px;background:#e07b3a;border:3px solid var(--avatar-ring);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;color:#1c2a38">R</div>
            <div style="width:18px;height:2px;background:var(--red-chip-line)"></div>
            <svg viewBox="0 0 24 24" width="22" height="22" fill="var(--red-text)"><path d="M12 21s-8-5-8-10.5A4.5 4.5 0 0112 7a4.5 4.5 0 018 3.5C20 16 12 21 12 21"></path></svg>
            <div style="width:18px;height:2px;background:var(--red-chip-line)"></div>
            <div style="width:54px;height:54px;border-radius:999px;background:#5f7c8a;border:3px solid var(--avatar-ring);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;color:#0d1620">E</div>
          </div>
          <div style="width:38px;height:38px;border-radius:999px;background:var(--blue-chip);border:1px solid var(--blue-chip-line);display:flex;align-items:center;justify-content:center;flex:none">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="var(--blue-text)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15.5V4M8.4 7.2L12 3.6l3.6 3.6M5.5 14.5v5h13v-5"></path></svg>
          </div>
        </div>
        <div style="font-family:var(--title-font);font-size:38px;font-weight:600;letter-spacing:-.02em;text-align:center;margin-top:12px">5 months</div>
      </sc-if>

      <sc-if value="{{isSimple}}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <div style="display:flex;align-items:center;gap:11px">
            <div style="width:40px;height:40px;border-radius:11px;background:var(--blue-chip);border:1px solid var(--blue-chip-line);display:flex;align-items:center;justify-content:center">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="var(--blue-text)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{headIcon}}"></path></svg>
            </div>
            <div style="font-family:var(--title-font);font-size:23px;font-weight:600;letter-spacing:-.01em">{{headTitle}}</div>
          </div>
          <div style="width:38px;height:38px;border-radius:999px;background:var(--blue-chip);border:1px solid var(--blue-chip-line);display:flex;align-items:center;justify-content:center;flex:none">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="var(--blue-text)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15.5V4M8.4 7.2L12 3.6l3.6 3.6M5.5 14.5v5h13v-5"></path></svg>
          </div>
        </div>
      </sc-if>

      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:28px auto;gap:6px 8px;margin-top:16px;text-align:center">
        <sc-for list="{{toplineLabels}}" as="s" hint-placeholder-count="3">
          <div style="font-size:11px;font-weight:600;letter-spacing:.08em;line-height:1.2;color:var(--text-3);align-self:start">{{s.label}}</div>
        </sc-for>
        <sc-for list="{{topline}}" as="s" hint-placeholder-count="3">
          <div style="font-size:{{toplineSize}};font-weight:600;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap;align-self:end">{{s.value}}</div>
        </sc-for>
      </div>

      <div style="height:1px;background:var(--line);margin:18px -18px"></div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px 14px">
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="6">
          <div style="display:flex;align-items:center;gap:11px">
            <div style="width:42px;height:42px;border-radius:999px;flex:none;background:{{c.chip}};display:flex;align-items:center;justify-content:center">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="{{c.fg}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{c.d}}"></path></svg>
            </div>
            <div style="min-width:0">
              <div style="font-size:13px;color:var(--text-2);line-height:1.25">{{c.label}}</div>
              <div style="font-size:17px;font-weight:600;margin-top:3px">{{c.value}}</div>
            </div>
          </div>
        </sc-for>
      </div>

      <sc-if value="{{isFlights}}" hint-placeholder-val="{{ true }}">
        <div style="margin-top:18px;background:var(--blue-chip);border:1px solid var(--blue-chip-line);border-radius:16px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between">
          <div style="font-size:16px;font-weight:600;color:var(--blue-text)">All flight stats</div>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--blue-text)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5l7 7-7 7"></path></svg>
        </div>
      </sc-if>
    </div>
  </div>
  <dc-import name="TabBar" active="Stats" style="position:absolute;left:16px;right:16px;bottom:16px" hint-size="358px,70px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;tab&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Relationship&quot;,&quot;Trips&quot;,&quot;Flights&quot;],&quot;default&quot;:&quot;Relationship&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  /** One size for the whole row, driven by its longest value, so peer stats share a baseline. */
  rowSize(rows) {
    const longest = Math.max(...rows.map(([, v]) => String(v).length));
    return longest > 7 ? "20px" : longest > 5 ? "22px" : "25px";
  }
  renderVals() {
    const tab = this.props.tab || "Relationship";
    const heart = "M12 20.5s-7.2-4.5-7.2-9.5A4 4 0 0112 7.4a4 4 0 017.2 3.6c0 5-7.2 9.5-7.2 9.5";
    const plane = "M3 13.5l18-6.2-6.3 17.2M3 13.5l6.6 2.4";
    const up = "M7 17L17 7M10 7h7v7";
    const down = "M17 7L7 17M14 17H7v-7";
    const hourglass = "M7 3.5h10M7 20.5h10M8.2 3.5v3.1L12 12l3.8-5.4V3.5M8.2 20.5v-3.1L12 12l3.8 5.4v3.1";
    const cal = "M5 6.5h14v13H5zM8.5 4v4M15.5 4v4M5 11h14";
    const pin = "M12 21v-6M12 15a4 4 0 100-8 4 4 0 000 8";
    const check = "M6 12.5l4 4 8-8.5";
    const globe = "M12 21a9 9 0 100-18 9 9 0 000 18M3.2 12h17.6M12 3c2.7 3.6 2.7 14.4 0 18M12 3c-2.7 3.6-2.7 14.4 0 18";
    const building = "M6 20.5V5.5h8v15M14 10.5h4v10M9 9h2M9 13h2M9 17h2";
    const home = "M4.5 10.5L12 4l7.5 6.5v10h-15z";

    const blue = { chip: "var(--blue-chip)", fg: "var(--blue-text)" };
    const green = { chip: "var(--green-chip)", fg: "var(--green-text)" };
    const red = { chip: "var(--red-chip)", fg: "var(--red-text)" };
    const neutral = { chip: "var(--neutral-chip)", fg: "var(--text-2)" };

    const sets = {
      Relationship: {
        topline: [["DAYS TOGETHER", "170"], ["TRIPS", "0"], ["MEMORIES", "0"]],
        cells: [
          { ...red, label: "Total reunions", value: "0", d: heart },
          { ...blue, label: "Longest distance apart", value: "12,749 km", d: plane },
          { ...green, label: "Longest trip", value: "—", d: up },
          { ...green, label: "Shortest trip", value: "—", d: down },
          { ...neutral, label: "Longest separation", value: "—", d: hourglass },
          { ...blue, label: "Next reunion", value: "Plan one", d: cal }
        ]
      },
      Trips: {
        headTitle: "Trip stats",
        headIcon: "M8 7V5.5A1.5 1.5 0 019.5 4h5A1.5 1.5 0 0116 5.5V7M4.5 7h15v12.5h-15z",
        topline: [["TOTAL TRIPS", "0"], ["DISTANCE", "0 km"], ["TRIP DAYS", "0"]],
        cells: [
          { ...green, label: "Longest trip", value: "—", d: up },
          { ...green, label: "Shortest trip", value: "—", d: down },
          { ...blue, label: "Top destination", value: "—", d: pin },
          { ...red, label: "Reunion trips", value: "0", d: heart },
          { ...blue, label: "Upcoming", value: "0", d: cal },
          { ...neutral, label: "Completed", value: "0", d: check }
        ]
      },
      Flights: {
        headTitle: "Flight stats",
        headIcon: plane,
        topline: [["FLIGHTS", "6"], ["DISTANCE", "40,947 km"], ["FLIGHT TIME", "50h 42m"]],
        cells: [
          { ...blue, label: "Airports", value: "11", d: building },
          { ...blue, label: "Airlines", value: "4", d: plane },
          { ...green, label: "Countries", value: "5", d: globe },
          { ...neutral, label: "Long haul", value: "3", d: hourglass },
          { ...neutral, label: "Domestic", value: "2", d: home },
          { ...blue, label: "International", value: "4", d: plane }
        ]
      }
    };
    const set = sets[tab] || sets.Relationship;

    return {
      tabs: ["Relationship", "Trips", "Flights"].map(label => {
        const on = label === tab;
        return {
          label,
          weight: on ? 600 : 500,
          fg: on ? "var(--text-1)" : "var(--text-2)",
          bg: on ? "var(--segment-on)" : "transparent",
          shadow: on ? "var(--shadow-card)" : "none"
        };
      }),
      isRelationship: tab === "Relationship",
      isSimple: tab !== "Relationship",
      isFlights: tab === "Flights",
      headTitle: set.headTitle || "",
      headIcon: set.headIcon || "",
      toplineLabels: set.topline.map(([label]) => ({ label })),
      topline: set.topline.map(([, value]) => ({ value })),
      toplineSize: this.rowSize(set.topline),
      cells: set.cells
    };
  }
}
</script>
</body>
</html>
