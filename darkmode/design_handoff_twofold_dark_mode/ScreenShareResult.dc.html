<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/twofold-design-tokens-2755dc26-ae41-450e-96e7-92f167979f40/styles.css">
</helmet>
<div style="position:relative;width:390px;height:844px;border-radius:46px;overflow:hidden;background:var(--bg-base);border:1px solid var(--frame-line);font-family:var(--font-body);color:var(--text-1)">
  <dc-import name="StatusBar" hint-size="390px,54px"></dc-import>
  <div style="padding:4px 18px 0;display:flex;flex-direction:column;align-items:center">
    <div style="display:flex;align-items:center;justify-content:space-between;height:44px;width:100%">
      <div style="width:40px;height:40px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--text-1)" stroke-width="2.1" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </div>
      <div style="font-size:17px;font-weight:600">Share result</div>
      <div style="width:40px"></div>
    </div>

    <div style="display:flex;padding:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;margin-top:12px;width:100%">
      <div style="flex:1;text-align:center;padding:9px 0;font-size:15px;font-weight:600;color:var(--text-1);background:var(--segment-on);border-radius:999px;box-shadow:var(--shadow-card)">Card</div>
      <div style="flex:1;text-align:center;padding:9px 0;font-size:15px;font-weight:500;color:var(--text-2)">Questions</div>
    </div>

    <div style="margin-top:22px">
      <dc-import name="ShareCard" variant="{{variant}}" accent="{{accent}}" theme="{{theme}}" game="{{game}}" question="{{question}}" answer-a="{{answerA}}" answer-b="{{answerB}}" score="{{score}}" tally-a="{{tallyA}}" tally-b="{{tallyB}}" tally-of="{{tallyOf}}" hint-size="320px,400px"></dc-import>
    </div>

    <div style="display:flex;gap:7px;margin-top:20px">
      <sc-for list="{{dots}}" as="d" hint-placeholder-count="4">
        <div style="width:7px;height:7px;border-radius:999px;background:{{d.bg}}"></div>
      </sc-for>
    </div>

    <div style="position:absolute;left:18px;right:18px;bottom:26px;display:flex;flex-direction:column;gap:6px">
      <div style="display:flex;gap:10px">
        <div style="flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 0;border-radius:999px;background:var(--blue-fill);color:var(--text-on-fill);font-size:16px;font-weight:600">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15.5V4M8.4 7.2L12 3.6l3.6 3.6M5.5 14.5v5h13v-5"></path></svg>
          Share
        </div>
        <div style="width:52px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="var(--text-1)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15.5V19h14v-3.5M12 4v11M8 11l4 4 4-4"></path></svg>
        </div>
      </div>
      <div style="text-align:center;font-size:14px;font-weight:600;color:var(--blue-text);padding:8px 0">More options</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Quote&quot;,&quot;Chat&quot;,&quot;Score&quot;,&quot;Tally&quot;],&quot;default&quot;:&quot;Quote&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;sky&quot;,&quot;leaf&quot;,&quot;heart&quot;],&quot;default&quot;:&quot;sky&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dot&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;min&quot;:0,&quot;max&quot;:3,&quot;tsType&quot;:&quot;number&quot;},&quot;game&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;DEEP CONVERSATION&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;question&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;What's something about blending families that excites you?&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;answerA&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;I don't have family nearby&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;answerB&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Seeing Rosie's baby pics&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;score&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;86%&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = Number(this.props.dot ?? 0);
    return {
      variant: this.props.variant || "Quote",
      accent: this.props.accent || "sky",
      game: this.props.game || "DEEP CONVERSATION",
      question: this.props.question || "What's something about blending families that excites you?",
      answerA: this.props.answerA || "I don't have family nearby",
      answerB: this.props.answerB || "Seeing Rosie's baby pics",
      score: this.props.score || "86%",
      theme: this.props.theme || "dark",
      tallyA: this.props.tallyA || "9",
      tallyB: this.props.tallyB || "11",
      tallyOf: this.props.tallyOf || "12",
      dots: [0, 1, 2, 3].map(i => ({ bg: i === active ? "var(--text-1)" : "var(--track)" }))
    };
  }
}
</script>
</body>
</html>
