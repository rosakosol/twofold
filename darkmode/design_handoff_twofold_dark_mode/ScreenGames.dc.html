<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/twofold-design-tokens-2755dc26-ae41-450e-96e7-92f167979f40/styles.css">
</helmet>
<div style="position:relative;width:390px;height:844px;border-radius:46px;overflow:hidden;background:var(--bg-base);border:1px solid var(--frame-line);font-family:var(--font-body);color:var(--text-1)">
  <dc-import name="StatusBar" hint-size="390px,54px"></dc-import>
  <div style="padding:4px 18px 0">
    <div style="display:flex;align-items:center;justify-content:space-between;height:44px">
      <div style="width:40px;height:40px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="var(--text-1)" stroke-width="1.9" stroke-linecap="round"><path d="M10.5 17a6.5 6.5 0 100-13 6.5 6.5 0 000 13M15.4 15.4L20 20"></path></svg>
      </div>
      <div style="width:40px;height:40px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="var(--text-1)" stroke-width="1.9" stroke-linecap="round"><path d="M4 12a8 8 0 108-8 8 8 0 00-6.6 3.5M4 4.5V8h3.5M12 8v4.4l3 1.8"></path></svg>
      </div>
    </div>

    <div style="font-family:var(--title-font);font-size:34px;font-weight:600;letter-spacing:-.02em;margin-top:12px">Games</div>

    <div style="display:flex;gap:8px;margin-top:14px">
      <div style="display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;background:var(--blue-chip);border:1px solid var(--blue-chip-line);position:relative">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="var(--blue-text)" stroke-width="2" stroke-linecap="round"><path d="M12 4a8 8 0 100 16 8 8 0 000-16M12 8v4.3l3 1.7"></path></svg>
        <div style="font-size:14px;font-weight:600;color:var(--blue-text)">Your turn</div>
        <div style="position:absolute;top:-6px;right:-4px;min-width:20px;height:20px;border-radius:999px;background:var(--red-fill);border:2px solid var(--bg-base);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff">5</div>
      </div>
      <div style="display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="var(--text-2)" stroke-width="2" stroke-linecap="round"><path d="M6 12.5l4 4 8-8.5"></path></svg>
        <div style="font-size:14px;font-weight:500;color:var(--text-2)">Answered</div>
      </div>
      <div style="display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="var(--text-2)" stroke-width="2" stroke-linecap="round"><path d="M12 4.5l1.7 4.3L18 10.5l-4.3 1.7L12 16.5l-1.7-4.3L6 10.5l4.3-1.7z"></path></svg>
        <div style="font-size:14px;font-weight:500;color:var(--text-2)">New</div>
      </div>
    </div>

    <div style="margin-top:16px;background:var(--hero-surface);border:1px solid var(--hero-line);border-radius:var(--radius-card);padding:16px;box-shadow:var(--shadow-card)">
      <div style="display:flex;align-items:center;gap:12px">
        <div style="width:44px;height:44px;border-radius:999px;background:var(--blue-chip);border:1px solid var(--blue-chip-line);display:flex;align-items:center;justify-content:center">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="var(--blue-text)" stroke-width="1.8" stroke-linecap="round"><path d="M12 21c3.6 0 5.5-2.4 5.5-5 0-4.5-5.5-6.5-4-13-4 2-7 6.3-7 10.6C6.5 18.4 8.4 21 12 21"></path></svg>
        </div>
        <div style="flex:1">
          <div style="font-size:18px;font-weight:600">1-day streak</div>
          <div style="font-size:14px;color:var(--text-2);margin-top:2px">Longest: 9 days</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--text-3)">NEXT IN</div>
          <div style="font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px">04:36</div>
        </div>
      </div>
      <div style="margin-top:14px;background:var(--prompt-bg);border:1px solid var(--prompt-line);border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px">
        <div style="flex:1">
          <div style="font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--prompt-label)">TODAY'S DEEP QUESTION</div>
          <div style="font-size:16px;font-weight:500;line-height:1.35;margin-top:6px;color:var(--text-1)">How would you describe yourself to someone who's never met you?</div>
        </div>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="var(--text-2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5l7 7-7 7"></path></svg>
      </div>
    </div>

    <div style="font-size:20px;font-weight:600;margin-top:22px">Game types</div>
    <div style="margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <sc-for list="{{tiles}}" as="t" hint-placeholder-count="4">
        <div style="height:126px;border-radius:18px;background:var(--surface-1);border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;justify-content:space-between">
          <div style="width:36px;height:36px;border-radius:10px;background:{{t.chip}};display:flex;align-items:center;justify-content:center">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="{{t.fg}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{t.d}}"></path></svg>
          </div>
          <div>
            <div style="font-size:16px;font-weight:600;line-height:1.25">{{t.title}}</div>
            <div style="font-size:13px;color:var(--text-3);margin-top:3px">{{t.meta}}</div>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
  <dc-import name="TabBar" active="Games" style="position:absolute;left:16px;right:16px;bottom:16px" hint-size="358px,70px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  renderVals() {
    return {
      tiles: [
        { title: "Trivia Battle", meta: "12 rounds", chip: "var(--blue-chip)", fg: "var(--blue-text)", d: "M12 4a8 8 0 100 16 8 8 0 000-16M9.7 9.4A2.4 2.4 0 0114.3 10c0 1.6-2.3 1.9-2.3 3.4M12 16.6h.01" },
        { title: "Who's More Likely To", meta: "8 prompts", chip: "var(--red-chip)", fg: "var(--red-text)", d: "M9 11a3 3 0 100-6 3 3 0 000 6M3.5 19.5c0-3 2.5-4.8 5.5-4.8s5.5 1.8 5.5 4.8M17 7.5a5 5 0 010 8" },
        { title: "This or That", meta: "20 pairs", chip: "var(--violet-chip)", fg: "var(--violet-text)", d: "M4 9h13l-3-3M20 15H7l3 3" },
        { title: "Deep Conversation", meta: "Daily", chip: "var(--green-chip)", fg: "var(--green-text)", d: "M4 6.5h11v8H8l-4 3.5zM17 9.5h3v8l-3-2.5h-2" }
      ]
    };
  }
}
</script>
</body>
</html>
