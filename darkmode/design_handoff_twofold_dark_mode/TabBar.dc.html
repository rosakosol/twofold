<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/twofold-design-tokens-2755dc26-ae41-450e-96e7-92f167979f40/styles.css">
</helmet>
<div style="height:70px;border-radius:999px;background:var(--tabbar-bg);border:1px solid var(--tabbar-line);box-shadow:var(--tabbar-shadow);backdrop-filter:blur(24px);display:flex;align-items:center;justify-content:space-between;padding:0 6px;font-family:var(--font-body)">
  <sc-for list="{{items}}" as="it" hint-placeholder-count="5">
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:56px;border-radius:999px;background:{{it.bg}}">
      <svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="{{it.color}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="{{it.d}}"></path></svg>
      <div style="font-size:11px;letter-spacing:.005em;color:{{it.color}};font-weight:{{it.weight}}">{{it.label}}</div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:358,&quot;height&quot;:70},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Home&quot;,&quot;Travel&quot;,&quot;Memories&quot;,&quot;Games&quot;,&quot;Stats&quot;],&quot;default&quot;:&quot;Home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const defs = [
      ["Home", "M12 21a9 9 0 100-18 9 9 0 000 18M3.2 12h17.6M12 3c2.7 3.6 2.7 14.4 0 18M12 3c-2.7 3.6-2.7 14.4 0 18"],
      ["Travel", "M3 13.5l18-6.2-6.3 17.2M3 13.5l6.6 2.4 2.2 5.1M9.6 15.9L21 7.3"],
      ["Memories", "M8.5 3.5h11.5v11.5M4 8.5h11.5V20H4z"],
      ["Games", "M6.5 8h11a4 4 0 010 8h-11a4 4 0 010-8M9 12h2.6M10.3 10.7v2.6M15.4 11.4h.01M17.2 12.8h.01"],
      ["Stats", "M5 19.5V12M12 19.5V4.5M19 19.5v-5"]
    ];
    const active = this.props.active || "Home";
    return {
      items: defs.map(([label, d]) => {
        const on = label === active;
        return { label, d, color: on ? "var(--tab-active-fg)" : "var(--tab-fg)", bg: on ? "var(--tab-active-bg)" : "transparent", weight: on ? 600 : 500 };
      })
    };
  }
}
</script>
</body>
</html>
