<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/twofold-design-tokens-2755dc26-ae41-450e-96e7-92f167979f40/styles.css">
</helmet>
<div style="position:relative;width:390px;height:844px;border-radius:46px;overflow:hidden;background:#04070b;border:1px solid var(--frame-line);font-family:var(--font-body);color:var(--text-1)">
  <div style="position:absolute;inset:0;background:radial-gradient(circle at 46% 74%, #223449 0%, #101d2b 34%, #05090e 62%, #03060a 100%)"></div>
  <div style="position:absolute;left:0;right:0;top:0;height:520px;overflow:hidden">
    <div style="position:absolute;left:30%;top:34%;font-size:13px;font-weight:600;letter-spacing:.34em;color:rgba(255,255,255,.62)">AUSTRALIA</div>
  </div>
  <div style="position:relative">
    <dc-import name="StatusBar" hint-size="390px,54px"></dc-import>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;height:392px;background:var(--sheet-bg);border-top:1px solid var(--line-strong);border-radius:32px 32px 0 0;padding:10px 18px 0;backdrop-filter:blur(30px)">
    <div style="width:44px;height:5px;border-radius:999px;background:var(--text-3);margin:0 auto 14px"></div>
    <div style="font-family:var(--title-font);font-size:32px;font-weight:600;letter-spacing:-.02em">Travel</div>

    <div style="display:flex;align-items:center;gap:12px;margin-top:16px">
      <div style="flex:1;display:flex;padding:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px">
        <div style="flex:1;text-align:center;padding:9px 0;font-size:15px;font-weight:500;color:var(--text-2)">Trips</div>
        <div style="flex:1;text-align:center;padding:9px 0;font-size:15px;font-weight:600;color:var(--text-1);background:var(--segment-on);border-radius:999px;box-shadow:0 1px 3px rgba(0,0,0,.4)">Flights</div>
      </div>
      <div style="width:42px;height:42px;border-radius:999px;background:var(--blue-fill);display:flex;align-items:center;justify-content:center">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M12 5.5v13M5.5 12h13"></path></svg>
      </div>
    </div>

    <div style="margin-top:16px;background:var(--hero-surface);border:1px solid var(--hero-line);border-radius:var(--radius-card);padding:16px;box-shadow:var(--shadow-card)">
      <div style="display:flex;align-items:center;gap:12px">
        <div style="width:38px;height:38px;border-radius:9px;background:#e21c26;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff">Q</div>
        <div>
          <div style="font-family:var(--title-font);font-size:21px;font-weight:600;letter-spacing:-.01em">MEL → LAX</div>
          <div style="font-size:15px;color:var(--text-2);margin-top:2px">Arrives in 2h 35m</div>
        </div>
      </div>
      <div style="height:1px;background:var(--line);margin:14px -16px 12px"></div>
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div style="font-size:14px;color:var(--text-2)">Qantas · QF93</div>
        <div style="font-size:13px;font-weight:600;color:var(--blue-text);background:var(--blue-chip);border:1px solid var(--blue-chip-line);border-radius:999px;padding:4px 12px">En route</div>
      </div>
    </div>

  </div>
  <dc-import name="TabBar" active="Travel" style="position:absolute;left:16px;right:16px;bottom:16px" hint-size="358px,70px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}"></script>
</body>
</html>
