<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/twofold-design-tokens-2755dc26-ae41-450e-96e7-92f167979f40/styles.css">
</helmet>
<div style="position:relative;width:390px;height:844px;border-radius:46px;overflow:hidden;background:var(--bg-base);border:1px solid var(--frame-line);font-family:var(--font-body);color:var(--text-1)">
  <dc-import name="StatusBar" hint-size="390px,54px"></dc-import>
  <div style="padding:4px 18px 0">
    <div style="display:flex;align-items:center;justify-content:space-between;height:44px">
      <div style="width:40px;height:40px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="var(--text-1)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5L8 12l6.5 7"></path></svg>
      </div>
      <div style="font-size:17px;font-weight:600">All games</div>
      <div style="width:40px"></div>
    </div>

    <div style="display:flex;flex-direction:column;gap:12px;margin-top:14px">
      <sc-for list="{{cards}}" as="c" hint-placeholder-count="4">
        <div style="background:var(--surface-1);border:1px solid var(--line);border-radius:var(--radius-card);padding:16px">
          <div style="display:flex;align-items:center;justify-content:space-between">
            <div style="font-size:12px;font-weight:600;letter-spacing:.05em;padding:5px 11px;border-radius:999px;color:{{c.tagFg}};background:{{c.tagBg}};border:1px solid {{c.tagLine}}">{{c.tag}}</div>
            <div style="font-size:13px;color:var(--text-3)">{{c.count}}</div>
          </div>
          <div style="font-size:19px;font-weight:600;margin-top:12px;letter-spacing:-.01em">{{c.title}}</div>
          <div style="display:flex;align-items:center;justify-content:space-between;margin-top:14px">
            <div style="display:flex;align-items:center;gap:8px">
              <div style="display:flex">
                <div style="width:30px;height:30px;border-radius:999px;background:#e07b3a;border:2px solid var(--surface-1);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#1c2a38">R</div>
                <div style="width:30px;height:30px;border-radius:999px;background:#5f7c8a;border:2px solid var(--surface-1);margin-left:-10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#0d1620">E</div>
              </div>
              <div style="font-size:13px;font-weight:500;color:{{c.stateFg}}">{{c.state}}</div>
            </div>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--text-3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5l7 7-7 7"></path></svg>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
  <dc-import name="TabBar" active="Games" style="position:absolute;left:16px;right:16px;bottom:16px" hint-size="358px,70px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  renderVals() {
    const travel = { tag: "Travel", tagFg: "var(--green-text)", tagBg: "var(--green-chip)", tagLine: "var(--green-chip-line)" };
    const edgy = { tag: "Edgy questions", tagFg: "var(--red-text)", tagBg: "var(--red-chip)", tagLine: "var(--red-chip-line)" };
    return {
      cards: [
        { ...travel, title: "Two Facts to Break the Ice", count: "10 questions", state: "Your turn", stateFg: "var(--blue-text)" },
        { ...travel, title: "What's Your Travel Style?", count: "14 questions", state: "Your turn", stateFg: "var(--blue-text)" },
        { ...edgy, title: "Would You Rather…?", count: "8 questions", state: "Completed 18 Jul", stateFg: "var(--green-text)" },
        { ...edgy, title: "Who's More Likely to Cause a Scene?", count: "12 questions", state: "Completed 15 Jul", stateFg: "var(--green-text)" }
      ]
    };
  }
}
</script>
</body>
</html>
