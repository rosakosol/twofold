<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/twofold-design-tokens-2755dc26-ae41-450e-96e7-92f167979f40/styles.css">
</helmet>
<div style="position:relative;width:390px;height:844px;border-radius:46px;overflow:hidden;background:var(--bg-base);border:1px solid var(--frame-line);font-family:var(--font-body);color:var(--text-1)">
  <dc-import name="StatusBar" hint-size="390px,54px"></dc-import>
  <div style="padding:4px 18px 0">
    <div style="display:flex;align-items:center;justify-content:space-between;height:44px">
      <div style="width:40px;height:40px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--text-1)" stroke-width="2.1" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </div>
      <div style="font-size:17px;font-weight:600">{{navTitle}}</div>
      <div style="display:flex;gap:8px">
        <div style="width:40px;height:40px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--text-1)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3.5l4.5 4.5-9 9H7v-4.5zM5 20.5h14"></path></svg>
        </div>
        <div style="width:40px;height:40px;border-radius:999px;background:var(--blue-chip);border:1px solid var(--blue-chip-line);display:flex;align-items:center;justify-content:center">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--blue-text)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15.5V4M8.4 7.2L12 3.6l3.6 3.6M5.5 14.5v5h13v-5"></path></svg>
        </div>
      </div>
    </div>

    <div style="margin-top:18px;background:var(--hero-surface);border:1px solid var(--hero-line);border-radius:var(--radius-card);padding:20px 18px 18px;box-shadow:var(--shadow-card)">
      <div style="display:flex;flex-direction:column;align-items:center;gap:7px">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="var(--blue-text)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5s-7.4-4.6-7.4-9.7A4.1 4.1 0 0112 7.1a4.1 4.1 0 017.4 3.7c0 5.1-7.4 9.7-7.4 9.7M4.9 11h14.2M12 7.1c2.3 3.4 2.3 10 0 13.4M12 7.1c-2.3 3.4-2.3 10 0 13.4"></path></svg>
        <div style="font-family:var(--font-display);font-size:27px;font-weight:500;letter-spacing:.005em;color:var(--text-1)">twofold</div>
      </div>

      <div style="height:1px;background:var(--line);margin:18px -18px"></div>

      <sc-if value="{{isStory}}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;align-items:center;justify-content:center;gap:12px">
          <div style="width:56px;height:56px;border-radius:999px;background:#e07b3a;border:3px solid var(--avatar-ring);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;color:#1c2a38">R</div>
          <div style="width:20px;height:2px;background:var(--red-chip-line)"></div>
          <svg viewBox="0 0 24 24" width="23" height="23" fill="var(--red-text)"><path d="M12 21s-8-5-8-10.5A4.5 4.5 0 0112 7a4.5 4.5 0 018 3.5C20 16 12 21 12 21"></path></svg>
          <div style="width:20px;height:2px;background:var(--red-chip-line)"></div>
          <div style="width:56px;height:56px;border-radius:999px;background:#5f7c8a;border:3px solid var(--avatar-ring);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;color:#0d1620">E</div>
        </div>
        <div style="font-family:var(--title-font);font-size:38px;font-weight:600;letter-spacing:-.02em;text-align:center;margin-top:14px">5 months</div>
      </sc-if>

      <sc-if value="{{isTrips}}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;align-items:center;gap:11px">
          <div style="width:40px;height:40px;border-radius:11px;background:var(--blue-chip);border:1px solid var(--blue-chip-line);display:flex;align-items:center;justify-content:center">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="var(--blue-text)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7V5.5A1.5 1.5 0 019.5 4h5A1.5 1.5 0 0116 5.5V7M4.5 7h15v12.5h-15z"></path></svg>
          </div>
          <div style="font-family:var(--title-font);font-size:23px;font-weight:600;letter-spacing:-.01em">Trip stats</div>
        </div>
      </sc-if>

      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:28px auto;gap:6px 8px;margin-top:16px;text-align:center">
        <sc-for list="{{toplineLabels}}" as="s" hint-placeholder-count="3">
          <div style="font-size:11px;font-weight:600;letter-spacing:.08em;line-height:1.2;color:var(--text-3);align-self:start">{{s.label}}</div>
        </sc-for>
        <sc-for list="{{topline}}" as="s" hint-placeholder-count="3">
          <div style="font-size:{{toplineSize}};font-weight:600;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap;align-self:end">{{s.value}}</div>
        </sc-for>
      </div>

      <div style="height:1px;background:var(--line);margin:18px -18px"></div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px 14px">
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="6">
          <div style="display:flex;align-items:center;gap:11px">
            <div style="width:42px;height:42px;border-radius:999px;flex:none;background:{{c.chip}};display:flex;align-items:center;justify-content:center">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="{{c.fg}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{c.d}}"></path></svg>
            </div>
            <div style="min-width:0">
              <div style="font-size:13px;color:var(--text-2);line-height:1.25">{{c.label}}</div>
              <div style="font-size:17px;font-weight:600;margin-top:3px">{{c.value}}</div>
            </div>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="display:flex;gap:10px;margin-top:16px">
      <div style="flex:1;text-align:center;padding:14px 0;border-radius:999px;background:var(--blue-fill);color:var(--text-on-fill);font-size:16px;font-weight:600">{{shareLabel}}</div>
      <div style="width:52px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="var(--text-1)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15.5V19h14v-3.5M12 4v11M8 11l4 4 4-4"></path></svg>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Story&quot;,&quot;Trips&quot;],&quot;default&quot;:&quot;Story&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const kind = this.props.kind || "Story";
    const heart = "M12 20.5s-7.2-4.5-7.2-9.5A4 4 0 0112 7.4a4 4 0 017.2 3.6c0 5-7.2 9.5-7.2 9.5";
    const plane = "M3 13.5l18-6.2-6.3 17.2M3 13.5l6.6 2.4";
    const up = "M7 17L17 7M10 7h7v7";
    const down = "M17 7L7 17M14 17H7v-7";
    const hourglass = "M7 3.5h10M7 20.5h10M8.2 3.5v3.1L12 12l3.8-5.4V3.5M8.2 20.5v-3.1L12 12l3.8 5.4v3.1";
    const cal = "M5 6.5h14v13H5zM8.5 4v4M15.5 4v4M5 11h14";
    const pin = "M12 21v-6M12 15a4 4 0 100-8 4 4 0 000 8";
    const check = "M6 12.5l4 4 8-8.5";

    const blue = { chip: "var(--blue-chip)", fg: "var(--blue-text)" };
    const green = { chip: "var(--green-chip)", fg: "var(--green-text)" };
    const red = { chip: "var(--red-chip)", fg: "var(--red-text)" };
    const neutral = { chip: "var(--neutral-chip)", fg: "var(--text-2)" };

    const isStory = kind === "Story";
    const topline = isStory
      ? [["DAYS TOGETHER", "170"], ["TRIPS", "0"], ["MEMORIES", "0"]]
      : [["TOTAL TRIPS", "0"], ["DISTANCE", "0 km"], ["TRIP DAYS", "0"]];
    const longest = Math.max(...topline.map(([, v]) => v.length));
    return {
      isStory,
      isTrips: !isStory,
      navTitle: isStory ? "Our story" : "Trip stats",
      shareLabel: isStory ? "Share our story" : "Share trip stats",
      toplineLabels: topline.map(([label]) => ({ label })),
      topline: topline.map(([, value]) => ({ value })),
      toplineSize: longest > 7 ? "20px" : longest > 5 ? "22px" : "25px",
      cells: isStory ? [
        { ...red, label: "Total reunions", value: "0", d: heart },
        { ...blue, label: "Longest distance apart", value: "12,749 km", d: plane },
        { ...green, label: "Longest trip", value: "—", d: up },
        { ...green, label: "Shortest trip", value: "—", d: down },
        { ...neutral, label: "Longest separation", value: "—", d: hourglass },
        { ...blue, label: "Next reunion", value: "Plan one", d: cal }
      ] : [
        { ...green, label: "Longest trip", value: "—", d: up },
        { ...green, label: "Shortest trip", value: "—", d: down },
        { ...blue, label: "Top destination", value: "—", d: pin },
        { ...red, label: "Reunion trips", value: "0", d: heart },
        { ...blue, label: "Upcoming", value: "0", d: cal },
        { ...neutral, label: "Completed", value: "0", d: check }
      ]
    };
  }
}
</script>
</body>
</html>
