<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/twofold-design-tokens-2755dc26-ae41-450e-96e7-92f167979f40/styles.css">
</helmet>
<div style="position:relative;width:390px;height:844px;border-radius:46px;overflow:hidden;background:var(--bg-base);border:1px solid var(--frame-line);font-family:var(--font-body);color:var(--text-1)">
  <dc-import name="StatusBar" hint-size="390px,54px"></dc-import>
  <div style="padding:4px 18px 0;display:flex;flex-direction:column;align-items:center">
    <div style="display:flex;align-items:center;justify-content:space-between;height:44px;width:100%">
      <div style="width:40px;height:40px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--text-1)" stroke-width="2.1" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </div>
      <div style="font-size:17px;font-weight:600">Distance</div>
      <div style="width:40px;height:40px;border-radius:999px;background:var(--blue-chip);border:1px solid var(--blue-chip-line);display:flex;align-items:center;justify-content:center">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--blue-text)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15.5V4M8.4 7.2L12 3.6l3.6 3.6M5.5 14.5v5h13v-5"></path></svg>
      </div>
    </div>

    <div style="margin-top:26px">
      <dc-import name="ShareCard" variant="Distance" accent="{{accent}}" theme="{{theme}}" distance="{{distance}}" city-a="{{cityA}}" city-b="{{cityB}}" hint-size="320px,400px"></dc-import>
    </div>

    <div style="width:100%;display:flex;flex-direction:column;margin-top:24px">
      <div style="display:flex;flex-direction:column;gap:10px">
        <div style="font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--text-3);text-align:center">CARD COLOUR</div>
        <div style="display:flex;justify-content:center;gap:10px">
          <sc-for list="{{swatches}}" as="s" hint-placeholder-count="3">
            <div style="display:flex;flex-direction:column;align-items:center;gap:7px">
              <div style="width:52px;height:52px;border-radius:16px;background:{{s.canvas}};border:2px solid {{s.ring}};display:flex;align-items:center;justify-content:center">
                <div style="width:14px;height:14px;border-radius:999px;background:{{s.dot}}"></div>
              </div>
              <div style="font-size:12px;font-weight:{{s.weight}};color:{{s.fg}}">{{s.label}}</div>
            </div>
          </sc-for>
        </div>
      </div>
      <div style="position:absolute;left:18px;right:18px;bottom:26px;display:flex;gap:10px">
        <div style="flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 0;border-radius:999px;background:var(--blue-fill);color:var(--text-on-fill);font-size:16px;font-weight:600">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15.5V4M8.4 7.2L12 3.6l3.6 3.6M5.5 14.5v5h13v-5"></path></svg>
          Share
        </div>
        <div style="width:52px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="var(--text-1)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15.5V19h14v-3.5M12 4v11M8 11l4 4 4-4"></path></svg>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;accent&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;sky&quot;,&quot;leaf&quot;,&quot;heart&quot;],&quot;default&quot;:&quot;sky&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;distance&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;12,771 km&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cityA&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Los Angeles&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cityB&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Melbourne&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme || "dark";
    const accent = this.props.accent || "sky";
    const art = {
      dark: {
        sky: ["linear-gradient(158deg,#123045,#08161F)", "#8ACFF5"],
        leaf: ["linear-gradient(158deg,#0F3229,#07171B)", "#8FE3AE"],
        heart: ["linear-gradient(158deg,#331B26,#170D14)", "#FFA3AB"]
      },
      light: {
        sky: ["linear-gradient(158deg,#E4F2FC,#DFF2EC)", "#2F82BE"],
        leaf: ["linear-gradient(158deg,#E3F5EA,#E7F5DE)", "#3E8C5E"],
        heart: ["linear-gradient(158deg,#FDEAEC,#F6E6EE)", "#C93B50"]
      }
    }[theme];
    return {
      theme, accent,
      distance: this.props.distance || "12,771 km",
      cityA: this.props.cityA || "Los Angeles",
      cityB: this.props.cityB || "Melbourne",
      swatches: [["sky", "Sky"], ["leaf", "Leaf"], ["heart", "Heart"]].map(([key, label]) => ({
        label,
        canvas: art[key][0],
        dot: art[key][1],
        ring: key === accent ? "var(--blue-text)" : "transparent",
        fg: key === accent ? "var(--text-1)" : "var(--text-2)",
        weight: key === accent ? 600 : 500
      }))
    };
  }
}
</script>
</body>
</html>
