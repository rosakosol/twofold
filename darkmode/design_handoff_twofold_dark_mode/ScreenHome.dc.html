<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/twofold-design-tokens-2755dc26-ae41-450e-96e7-92f167979f40/styles.css">
</helmet>
<div style="position:relative;width:390px;height:844px;border-radius:46px;overflow:hidden;background:var(--bg-base);border:1px solid var(--frame-line);font-family:var(--font-body);color:var(--text-1)">
  <dc-import name="StatusBar" hint-size="390px,54px"></dc-import>
  <div style="padding:6px 18px 0;display:flex;flex-direction:column;gap:14px">

    <div style="display:flex;align-items:center;justify-content:space-between;height:44px">
      <div style="width:40px;height:40px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="var(--text-2)" stroke-width="1.8" stroke-linecap="round"><path d="M12 11a3.6 3.6 0 100-7.2 3.6 3.6 0 000 7.2M4.8 20.4c0-3.6 3.2-5.6 7.2-5.6s7.2 2 7.2 5.6"></path></svg>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <div style="width:38px;height:38px;border-radius:999px;background:#e07b3a;border:2px solid var(--surface-3);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#1c2a38">R</div>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="var(--red-text)"><path d="M12 21s-8-5-8-10.5A4.5 4.5 0 0112 7a4.5 4.5 0 018 3.5C20 16 12 21 12 21"></path></svg>
        <div style="width:38px;height:38px;border-radius:999px;background:#5f7c8a;border:2px solid var(--surface-3);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#0d1620">E</div>
      </div>
      <div style="width:40px"></div>
    </div>

    <div style="background:var(--surface-1);border:1px solid var(--line);border-radius:var(--radius-card);padding:16px 18px;display:flex;align-items:center;justify-content:space-between">
      <div>
        <div style="font-size:17px;font-weight:600;line-height:1.3">It's 9:35 pm right now</div>
        <div style="font-size:15px;color:var(--text-2);margin-top:2px">in Melbourne</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="var(--text-2)" stroke-width="1.7" stroke-linecap="round"><path d="M15.5 4.5A6.5 6.5 0 118 15.5a8 8 0 007.5-11M6 18.5h9"></path></svg>
        <div style="font-size:20px;font-weight:600">10°</div>
      </div>
    </div>

    <div style="background:var(--hero-surface);border:1px solid var(--hero-line);border-radius:var(--radius-card);padding:16px;box-shadow:var(--shadow-card)">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div style="font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--text-3)">TRACKING NOW</div>
        <div style="font-size:13px;font-weight:600;color:var(--blue-text);background:var(--blue-chip);border:1px solid var(--blue-chip-line);border-radius:999px;padding:4px 12px">En route</div>
      </div>
      <div style="display:flex;align-items:center;gap:9px;margin-top:10px">
        <div style="width:26px;height:26px;border-radius:7px;background:#e21c26;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff">Q</div>
        <div style="font-size:16px;font-weight:600">Qantas · QF93</div>
      </div>
      <div style="display:flex;align-items:baseline;justify-content:space-between;margin-top:14px;gap:10px">
        <div style="font-family:var(--title-font);font-size:22px;font-weight:600;letter-spacing:-.01em">Melbourne → Los Angeles</div>
        <div style="font-size:14px;color:var(--text-2);white-space:nowrap">14h 23m</div>
      </div>
      <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-top:12px">
        <div style="font-size:17px;font-weight:600;color:var(--blue-text)">Arrives in 2h 34m</div>
        <div style="display:flex;flex-direction:column;gap:3px;align-items:flex-end;font-size:14px">
          <div style="display:flex;gap:8px;align-items:center"><span style="color:var(--text-3)">MEL</span><span style="font-weight:600;font-variant-numeric:tabular-nums">9:47 am</span></div>
          <div style="display:flex;gap:8px;align-items:center"><span style="color:var(--text-3)">LAX</span><span style="font-weight:600;font-variant-numeric:tabular-nums">7:10 am</span></div>
        </div>
      </div>
      <div style="margin-top:14px;height:186px;border-radius:14px;background:var(--map-bg);border:1px solid var(--line);position:relative;overflow:hidden">
        <div style="position:absolute;left:12%;bottom:22%;width:66%;height:3px;background:var(--blue-fill);transform:rotate(-27deg);transform-origin:left center;border-radius:2px"></div>
        <div style="position:absolute;left:11%;bottom:20%;width:11px;height:11px;border-radius:999px;background:var(--map-bg);border:2.5px solid #fff"></div>
        <div style="position:absolute;right:10%;top:20%;width:11px;height:11px;border-radius:999px;background:var(--map-bg);border:2.5px solid #fff"></div>
        <div style="position:absolute;left:52%;top:41%;width:34px;height:34px;border-radius:999px;background:#e07b3a;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#1c2a38">R</div>
        <div style="position:absolute;left:14px;bottom:12px;font-size:11px;color:var(--text-3);letter-spacing:.04em">Map placeholder</div>
      </div>
    </div>

    <div style="background:var(--surface-1);border:1px solid var(--line);border-radius:var(--radius-card);padding:16px 18px">
      <div style="display:flex;align-items:flex-start;justify-content:space-between">
        <div>
          <div style="font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--text-3)">SAME CITY</div>
          <div style="font-family:var(--title-font);font-size:20px;font-weight:600;margin-top:6px">You're both in Melbourne</div>
        </div>
        <svg viewBox="0 0 24 24" width="22" height="22" fill="var(--red-text)"><path d="M12 21s-8-5-8-10.5A4.5 4.5 0 0112 7a4.5 4.5 0 018 3.5C20 16 12 21 12 21"></path></svg>
      </div>
      <div style="font-size:14px;color:var(--text-2);margin-top:8px">No distance to close right now</div>
    </div>

  </div>
  <dc-import name="TabBar" active="Home" style="position:absolute;left:16px;right:16px;bottom:16px" hint-size="358px,70px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}"></script>
</body>
</html>
