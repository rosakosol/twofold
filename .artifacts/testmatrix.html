<title>Twofold Test Matrix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">

<style>
  :root {
    --ground: #F6F9FB;
    --surface: #FFFFFF;
    --surface-2: #EEF4F8;
    --ink: #17242F;
    --muted: #5B6B7A;
    --line: #DCE6ED;
    --accent: #1F6F9E;
    --critical: #C2334A;
    --done: #1E7A4B;
    --warn: #8A5E00;
    --shadow: 0 1px 2px rgba(23, 36, 47, .06), 0 8px 24px rgba(23, 36, 47, .05);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --ground: #0A121A;
      --surface: #14222D;
      --surface-2: #1B2C39;
      --ink: #E8F0F5;
      --muted: #93A7B5;
      --line: #24363F;
      --accent: #8ACFF5;
      --critical: #FF9BA3;
      --done: #88DFA9;
      --warn: #E8B23A;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .3);
    }
  }
  :root[data-theme="dark"] {
    --ground: #0A121A;
    --surface: #14222D;
    --surface-2: #1B2C39;
    --ink: #E8F0F5;
    --muted: #93A7B5;
    --line: #24363F;
    --accent: #8ACFF5;
    --critical: #FF9BA3;
    --done: #88DFA9;
    --warn: #E8B23A;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .3);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 60rem; margin: 0 auto; padding: 0 1.25rem 5rem; }

  /* ---------- masthead ---------- */
  .masthead { padding: 3rem 0 1.5rem; }
  .eyebrow {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .72rem; letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 .75rem;
  }
  h1 {
    font-family: "IBM Plex Sans Condensed", "IBM Plex Sans", sans-serif;
    font-weight: 700; font-size: clamp(2.1rem, 5vw, 3.1rem);
    line-height: 1.04; letter-spacing: -.015em; margin: 0 0 .6rem;
    text-wrap: balance;
  }
  .standfirst { color: var(--muted); max-width: 46ch; margin: 0; font-size: 1.02rem; }

  /* ---------- progress ---------- */
  .status {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--ground) 88%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    margin: 1.5rem 0 2.5rem;
    padding: .85rem 0;
  }
  .status-inner { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
  .meter { flex: 1 1 12rem; height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .meter-fill { height: 100%; width: 0%; background: var(--accent); transition: width .35s ease; }
  .tally {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .8rem; font-variant-numeric: tabular-nums; color: var(--muted);
    white-space: nowrap;
  }
  .tally b { color: var(--ink); font-weight: 600; }
  .blockers-left { color: var(--critical); font-weight: 600; }
  .blockers-left.clear { color: var(--done); }
  .savechip {
    font-family: "IBM Plex Mono", monospace; font-size: .7rem;
    letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
    opacity: 0; transition: opacity .25s ease; white-space: nowrap;
  }
  .savechip.on { opacity: 1; }
  .savechip.warn { color: var(--warn); opacity: 1; }

  /* ---------- sections ---------- */
  section { margin: 0 0 2.75rem; }
  .sec-head { display: flex; align-items: baseline; gap: .75rem; flex-wrap: wrap; margin-bottom: .35rem; }
  h2 {
    font-family: "IBM Plex Sans Condensed", sans-serif;
    font-weight: 700; font-size: 1.35rem; letter-spacing: -.005em; margin: 0;
  }
  .chip {
    font-family: "IBM Plex Mono", monospace; font-size: .65rem;
    letter-spacing: .1em; text-transform: uppercase; font-weight: 600;
    padding: .18rem .45rem; border-radius: 4px; white-space: nowrap;
  }
  .chip.blocker { color: var(--critical); background: color-mix(in srgb, var(--critical) 14%, transparent); }
  .chip.high    { color: var(--warn);     background: color-mix(in srgb, var(--warn) 16%, transparent); }
  .chip.std     { color: var(--muted);    background: var(--surface-2); }
  .chip.untested{ color: var(--accent);   background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .sec-note { color: var(--muted); font-size: .93rem; margin: 0 0 1rem; max-width: 62ch; }

  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .4rem; }

  .item {
    display: grid; grid-template-columns: auto 1fr; gap: .8rem;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: .8rem .95rem; cursor: pointer; box-shadow: var(--shadow);
    transition: border-color .15s ease, opacity .2s ease;
  }
  .item:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
  .item:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .item.done { opacity: .5; }
  .item.done .title { text-decoration: line-through; text-decoration-thickness: 1px; }

  input[type="checkbox"] {
    appearance: none; margin: .28rem 0 0; width: 1.15rem; height: 1.15rem;
    border: 1.5px solid color-mix(in srgb, var(--ink) 35%, transparent);
    border-radius: 5px; background: transparent; cursor: pointer; flex: none;
    display: grid; place-content: center;
  }
  input[type="checkbox"]::after {
    content: ""; width: .58rem; height: .32rem;
    border-left: 2px solid var(--surface); border-bottom: 2px solid var(--surface);
    transform: rotate(-45deg) scale(0); transition: transform .15s ease;
    margin-top: -.12rem;
  }
  input[type="checkbox"]:checked { background: var(--done); border-color: var(--done); }
  input[type="checkbox"]:checked::after { transform: rotate(-45deg) scale(1); }
  input[type="checkbox"]:disabled { cursor: not-allowed; opacity: .5; }

  .title { font-weight: 500; margin: 0; }
  .why { color: var(--muted); font-size: .89rem; margin: .15rem 0 0; }
  .why code {
    font-family: "IBM Plex Mono", monospace; font-size: .85em;
    background: var(--surface-2); padding: .05rem .3rem; border-radius: 4px;
  }
  .flag {
    display: inline-block; font-family: "IBM Plex Mono", monospace;
    font-size: .63rem; letter-spacing: .09em; text-transform: uppercase;
    font-weight: 600; color: var(--critical); margin-left: .45rem;
    vertical-align: 1px;
  }
  .flag.ok { color: var(--done); }

  .readonly-banner {
    display: none; background: color-mix(in srgb, var(--warn) 12%, var(--surface));
    border: 1px solid color-mix(in srgb, var(--warn) 35%, var(--line));
    border-radius: 10px; padding: .8rem 1rem; margin-bottom: 1.5rem;
    font-size: .92rem; color: var(--ink);
  }
  .readonly-banner.on { display: block; }

  footer {
    border-top: 1px solid var(--line); margin-top: 3rem; padding-top: 1.25rem;
    color: var(--muted); font-size: .87rem; max-width: 62ch;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>

<div class="wrap">
  <header class="masthead">
    <p class="eyebrow">Twofold · coverage &amp; manual passes</p>
    <h1>Test Matrix</h1>
    <p class="standfirst">What runs on its own, what the paired test accounts newly unlocked, and what only a human with two phones can check.</p>
  </header>

  <div class="status">
    <div class="status-inner">
      <div class="meter"><div class="meter-fill" id="fill"></div></div>
      <div class="tally"><b id="doneCount">0</b>/<span id="totalCount">0</span> done</div>
      <div class="tally" id="blockerTally"></div>
      <div class="savechip" id="savechip">Saved</div>
    </div>
  </div>

  <div class="readonly-banner" id="ro"></div>
  <main id="list"></main>

  <footer id="foot"></footer>
</div>

<script type="application/json" id="seed">{}</script>
<script>
(function () {
  "use strict";

  var SECTIONS = [
    {
      id: "auto", title: "Runs without you", chip: "std", chipLabel: "Automated",
      note: "157 checks, all currently green. Run them before every build you submit — the first three take seconds.",
      items: [
        { id: "a-swift", t: "Swift unit tests — 71 across 6 suites", pre: true,
          w: "<code>xcodebuild test -scheme Twofold -only-testing:TwofoldTests</code><br>Covers game logic, deck ordering, flight stat counting, notification route parsing, trip route labels." },
        { id: "a-pgtap", t: "Database tests — 42 pgTAP", pre: true,
          w: "<code>supabase test db</code> (needs Docker + <code>supabase start</code>)<br>Day boundaries, streak lapse rules, subscription tiers, and the daily-session uniqueness guarantee." },
        { id: "a-deno", t: "Backend tests — 44 Deno", pre: true,
          w: "<code>docker run --rm -v \"$PWD\":/app -w /app --entrypoint deno denoland/deno:latest test --allow-all supabase/functions/</code><br>Flight refresh cadence, reminder windows, candidate merging, and the past/present/future search windows." },
        { id: "a-a11y", t: "Accessibility audit across all five tabs", pre: true,
          w: "<code>-only-testing:TwofoldUITests/AppWalkthroughUITests</code><br>Prints findings rather than failing; grep the log for <code>A11Y</code>. Re-run at an accessibility text size to catch layout breaks." },
        { id: "a-swipe", t: "Swipe card returns to rest", pre: true,
          w: "<code>-only-testing:TwofoldUITests/SwipeCardUITests</code><br>Short drags, repeated drags, edge-started drags. Note: it does <em>not</em> reproduce the stuck-card bug — see the caveat in the source." },
        { id: "a-deeplink", t: "Notification routes survive a cold launch", pre: true,
          w: "<code>-only-testing:TwofoldUITests/NotificationDeepLinkUITests</code><br>Uses the DEBUG <code>-notificationRoute</code> seed to stand in for a tap." },
        { id: "a-seed", t: "Seed the paired test couple", pre: true,
          w: "<code>python3 scripts/seed-test-couple.py</code> with the four <code>TWOFOLD_*</code> env vars set. Creates or reuses both accounts and pairs them. Verified working — couple <code>146b0590…</code>." }
      ]
    },
    {
      id: "unlocked", title: "Newly testable — not yet automated", chip: "high", chipLabel: "Next to build",
      note: "The seed script makes these reachable for the first time. Each is a UI test I could write against a signed-in, paired account; none exist yet.",
      items: [
        { id: "u-signin", t: "Sign in with email and password",
          w: "The two-field path. Everything below depends on it, so it's the first one worth writing." },
        { id: "u-games", t: "Play a deck to completion and see results",
          w: "Which also finally makes the game results share card reachable — the one screen this session could never open." },
        { id: "u-daily", t: "Answer the daily question and watch the streak advance" },
        { id: "u-memory", t: "Add a memory with a photo, confirm it appears for the partner" },
        { id: "u-trip", t: "Add a trip, confirm the countdown and globe update" },
        { id: "u-paywall", t: "Buy, restore and cancel against the StoreKit config",
          w: "<code>Twofold.storekit</code> is already wired into the scheme, so purchases work in the simulator without a sandbox Apple ID. This is automatable and would cover the highest-rejection-risk area." }
      ]
    },
    {
      id: "twophone", title: "Two devices, by hand", chip: "blocker", chipLabel: "Manual only",
      note: "One XCUITest run drives one app on one device. Anything where A acts and B observes needs you, two simulators or phones, and both accounts signed in.",
      items: [
        { id: "m-pair", t: "Pair through the real UI, not the script",
          w: "A generates a code in-app, B enters it, A accepts the request. The script proves the RPCs work; only this proves the screens do." },
        { id: "m-pairpush", t: "B redeeming sends A a connection-request notification" },
        { id: "m-bothanswer", t: "Both answer a deck — answers stay hidden until the second one finishes",
          w: "The reveal is the whole mechanic. Check the waiting state on the first device while the second is still playing." },
        { id: "m-partnerfinished", t: "“Partner finished” notification arrives and opens that game" },
        { id: "m-streakboth", t: "Streak only advances once both have answered",
          w: "Answer as A alone first and confirm it does <em>not</em> move." },
        { id: "m-editanswers", t: "One partner editing answers doesn't corrupt the other's view" },
        { id: "m-drawing", t: "A drawing saved by one appears on the other's widget" },
        { id: "m-sharedsub", t: "One subscribes, the other gains access",
          w: "Then have the payer disconnect and confirm the other lands on the lapsed-from-disconnect screen, not the generic paywall." },
        { id: "m-leave", t: "Leaving the couple, from both sides",
          w: "And account deletion from one side — check what the other sees afterwards." }
      ]
    },
    {
      id: "device", title: "Real device only", chip: "blocker", chipLabel: "Manual only",
      note: "Nothing in the simulator can stand in for these.",
      items: [
        { id: "d-push", t: "Tap a real push from a cold start",
          w: "Force-quit first. All four kinds: streak reminder, flight update, game event, drawing. This is the case that was broken and the fix is unverified against a real tap." },
        { id: "d-pushperm", t: "Notification permission prompt, and the app with it declined" },
        { id: "d-live", t: "Live Activity through a full flight",
          w: "Pre-departure, in-air, landed. It previously stranded on pre-departure content after landing." },
        { id: "d-widgets", t: "Home Screen and Lock Screen widgets, all sizes and tiers" },
        { id: "d-faceid", t: "Face ID app lock, including after sign-out" },
        { id: "d-camera", t: "Capture a boarding pass with the camera" },
        { id: "d-share", t: "Share sheet and Instagram Stories from every share card" },
        { id: "d-shareext", t: "Forward a flight confirmation email into the share extension" }
      ]
    },
    {
      id: "external", title: "Depends on someone else's system", chip: "untested", chipLabel: "Unverified",
      note: "Not one real call was made to these all session. They're the largest untested surface in the app.",
      items: [
        { id: "x-aeroapi", t: "Flight search against live AeroAPI",
          w: "One flight from over a month ago (the history fallback is brand new and has never run against the real API), one today, one several months out." },
        { id: "x-add", t: "Add a flight end to end",
          w: "Never tested — it writes a tracked flight and starts a webhook subscription." },
        { id: "x-refresh", t: "A tracked flight actually updating as it flies" },
        { id: "x-weather", t: "WeatherKit returns real conditions, and the attribution shows with them",
          w: "Requires the WeatherKit capability enabled on the App ID. With it off, the app shows no temperature and no mark, which is correct but proves nothing." },
        { id: "x-revenuecat", t: "RevenueCat against a real sandbox purchase, not just the StoreKit config" }
      ]
    },
    {
      id: "edges", title: "Conditions worth forcing", chip: "high", chipLabel: "Easy to skip",
      note: "Cheap to test and where bugs hide. Most take under a minute each.",
      items: [
        { id: "e-offline", t: "Airplane mode: play a game, add a memory, then reconnect",
          w: "There's an offline queue for game responses; confirm it drains and nothing double-submits." },
        { id: "e-slow", t: "Slow network — the daily question skeleton should hold its space, not jump" },
        { id: "e-ax", t: "Largest accessibility text size on every tab",
          w: "Games was completely unusable at this size before this session. Re-check after any layout change." },
        { id: "e-voiceover", t: "VoiceOver through Home and one full game" },
        { id: "e-dark", t: "Dark and light, plus the in-app appearance override" },
        { id: "e-solo", t: "The whole app as a solo user, never paired",
          w: "Several counts derive from both partners answering, which can never happen solo — the Answered sections use a both-completed check that a solo player can't satisfy." },
        { id: "e-empty", t: "A brand new account with no trips, flights or memories" },
        { id: "e-timezone", t: "Change the device timezone and confirm the day boundary follows",
          w: "Streak reset and the daily question both key off your own local midnight." }
      ]
    }
  ];

  var LS_KEY = "twofold-testmatrix-v1";
  var state = { checked: {} };
  var canPublish = false;
  var api = null;
  var timer = null;

  var listEl = document.getElementById("list");
  var chip = document.getElementById("savechip");
  var roEl = document.getElementById("ro");

  function allItems() {
    return SECTIONS.reduce(function (acc, s) { return acc.concat(s.items); }, []);
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function render() {
    listEl.innerHTML = SECTIONS.map(function (s) {
      var items = s.items.map(function (it) {
        var on = !!state.checked[it.id];
        return '<li><label class="item' + (on ? " done" : "") + '" data-id="' + it.id + '">' +
          '<input type="checkbox"' + (on ? " checked" : "") +
          ' aria-describedby="why-' + it.id + '">' +
          '<div><p class="title">' + esc(it.t) +
          (it.flag ? '<span class="flag">Blocker</span>' : "") +
          (it.pre ? '<span class="flag ok">In code</span>' : "") + "</p>" +
          (it.w ? '<p class="why" id="why-' + it.id + '">' + it.w + "</p>" : "") +
          "</div></label></li>";
      }).join("");
      return '<section><div class="sec-head"><h2>' + esc(s.title) + "</h2>" +
        '<span class="chip ' + s.chip + '">' + esc(s.chipLabel) + "</span></div>" +
        (s.note ? '<p class="sec-note">' + esc(s.note) + "</p>" : "") +
        "<ul>" + items + "</ul></section>";
    }).join("");
    updateTally();
  }

  function updateTally() {
    var items = allItems();
    var done = items.filter(function (i) { return state.checked[i.id]; }).length;
    var pct = items.length ? Math.round((done / items.length) * 100) : 0;
    document.getElementById("fill").style.width = pct + "%";
    document.getElementById("doneCount").textContent = done;
    document.getElementById("totalCount").textContent = items.length;

    var blockers = SECTIONS.filter(function (s) { return s.chip === "blocker"; })
      .reduce(function (a, s) { return a.concat(s.items); }, []);
    var left = blockers.filter(function (i) { return !state.checked[i.id]; }).length;
    var tally = document.getElementById("blockerTally");
    tally.innerHTML = left
      ? '<span class="blockers-left">' + left + " blocker" + (left === 1 ? "" : "s") + " left</span>"
      : '<span class="blockers-left clear">Blockers clear</span>';
  }

  function setChip(text, warn) {
    chip.textContent = text;
    chip.className = "savechip on" + (warn ? " warn" : "");
    if (!warn) {
      clearTimeout(setChip._t);
      setChip._t = setTimeout(function () { chip.className = "savechip"; }, 1800);
    }
  }

  // A publish failure means ticks stop syncing, not that the checklist stops working. It used
  // to also re-render with every checkbox disabled, so a single failed save locked the page.
  function noteLocalOnly(msg) {
    canPublish = false;
    roEl.textContent = msg;
    roEl.className = "readonly-banner on";
  }

  function save() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) { /* private mode */ }
    if (!canPublish || !api) return;
    clearTimeout(timer);
    setChip("Saving…");
    // One publish per pause, never per tick — every call mints a version.
    timer = setTimeout(function () {
      api.publish({ "data/state.json": JSON.stringify(state) }).then(function () {
        setChip("Saved");
      }).catch(function (err) {
        var code = err && err.code;
        if (code === "conflict") {
          setChip("Reopen to sync", true);
        } else if (code === "not_writer" || code === "not_granted" || code === "capability_disabled" || code === "not_declared") {
          noteLocalOnly("Ticks are saved on this device only \u2014 this view can't write back to the artifact, so they won't follow you to another browser.");
        } else if (code === "rate_limited") {
          setChip("Slowing down…", true);
        } else {
          setChip("Not saved", true);
        }
      });
    }, 1200);
  }

  listEl.addEventListener("change", function (e) {
    var box = e.target;
    if (!box || box.type !== "checkbox") return;
    var label = box.closest(".item");
    if (!label) return;
    var id = label.getAttribute("data-id");
    if (box.checked) state.checked[id] = true; else delete state.checked[id];
    label.classList.toggle("done", box.checked);
    updateTally();
    save();
  });

  // Local copy first so the page is usable immediately, then the shared one wins if present.
  try {
    var cached = localStorage.getItem(LS_KEY);
    if (cached) state = JSON.parse(cached) || state;
  } catch (e) { /* ignore */ }
  if (!state.checked) state.checked = {};

  document.getElementById("foot").innerHTML =
    "157 checks run without you: 71 Swift unit, 42 pgTAP, 44 Deno, plus the UI suites. " +
    "scripts/seed-test-couple.py pairs the two test accounts in one command, which is what makes " +
    "the partner-side rows testable at all. Ticks save automatically.";

  render();

  fetch("./data/state.json", { cache: "no-store" })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (remote) {
      if (remote && remote.checked) { state = remote; render(); }
    })
    .catch(function () { /* first run: no file yet */ });

  if (window.claude && window.claude.use) {
    window.claude.use("artifact").then(function (ns) {
      if (!ns) return;
      api = ns;
      canPublish = true;
      render();
    });
  }
})();
</script>
