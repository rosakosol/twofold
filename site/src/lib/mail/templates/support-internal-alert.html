<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>{{subject}}</title>
<!--[if mso]><style>body,table,td,a{font-family:Arial,Helvetica,sans-serif !important}</style><![endif]-->
<style>
  @media only screen and (max-width:620px){
    .sp{padding-left:24px !important;padding-right:24px !important}
    .h1{font-size:24px !important;line-height:30px !important}
  }
  a{color:#3d8fc9}
  a:hover{color:#4fa9e0}
</style>
</head>
<body style="margin:0;padding:0;background-color:#e6f3ea;-webkit-text-size-adjust:100%;">
<span style="display:none;font-size:1px;color:#e6f3ea;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;">{{preheader}}</span>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#e6f3ea;">
<tr><td align="center" style="padding:32px 12px 48px 12px;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="width:600px;max-width:600px;">

    <tr><td align="center" style="padding:8px 0 22px 0;font-family:Arial,Helvetica,sans-serif;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#8695a3;">
      Twofold &nbsp;·&nbsp; new support ticket
    </td></tr>

    <tr><td style="background-color:#ffffff;border-radius:20px;border:1px solid rgba(28,42,56,.06);">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;">

        <tr><td class="sp" style="padding:40px 44px 0 44px;">
          <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
            <td style="background-color:#fdeaec;border-radius:999px;padding:7px 16px;font-family:Arial,Helvetica,sans-serif;font-size:12px;font-weight:bold;letter-spacing:.08em;text-transform:uppercase;color:#d1465a;mso-line-height-rule:exactly;line-height:14px;">{{ticket_category}}</td>
            <td width="10" style="width:10px;">&nbsp;</td>
            <td style="background-color:#f4faff;border-radius:999px;padding:7px 16px;font-family:Arial,Helvetica,sans-serif;font-size:12px;font-weight:bold;letter-spacing:.08em;text-transform:uppercase;color:#3d8fc9;mso-line-height-rule:exactly;line-height:14px;">#{{ticket_id}}</td>
          </tr></table>
        </td></tr>

        <tr><td class="sp h1" style="padding:20px 44px 0 44px;font-family:Georgia,'Times New Roman',serif;font-size:28px;line-height:34px;mso-line-height-rule:exactly;color:#1c2a38;">
          {{ticket_subject}}
        </td></tr>
        <tr><td class="sp" style="padding:10px 44px 0 44px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:24px;mso-line-height-rule:exactly;color:#5b6b7a;">
          <strong style="color:#1c2a38;">{{user_name}}</strong> · <a href="mailto:{{user_email}}" style="color:#3d8fc9;text-decoration:none;">{{user_email}}</a> · {{received_at}}
        </td></tr>

        <!-- message -->
        <tr><td class="sp" style="padding:26px 44px 0 44px;">
          <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;">
            <tr><td style="border-left:3px solid #6fbf8b;padding:2px 0 2px 18px;font-family:Georgia,'Times New Roman',serif;font-size:16px;line-height:27px;mso-line-height-rule:exactly;color:#1c2a38;">
              {{message_body}}
            </td></tr>
          </table>
        </td></tr>

        <!-- Website submissions carry no account/device/sync context — that table (and the
             analytics "signal" line) only made sense for an in-app report with real telemetry
             behind it, so both are omitted here rather than shown with fabricated values. -->

        <tr><td class="sp" style="padding:28px 44px 42px 44px;">
          <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
            <td style="border:1px solid rgba(28,42,56,.09);border-radius:999px;">
              <a href="mailto:{{user_email}}?subject=Re:%20%23{{ticket_id}}" style="display:block;padding:12px 24px;font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:bold;color:#3d8fc9;text-decoration:none;mso-line-height-rule:exactly;line-height:20px;">Reply to {{first_name}}</a>
            </td>
          </tr></table>
        </td></tr>

      </table>
    </td></tr>

    <tr><td align="center" style="padding:24px 40px 0 40px;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:20px;mso-line-height-rule:exactly;color:#8695a3;">
      Automated alert from Twofold support
    </td></tr>

  </table>
</td></tr>
</table>
</body>
</html>
